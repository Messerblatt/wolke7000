# Wolke 7000 progression rules. See the unlock condition examples below.
version: 1
redirect: "/exilium-ag"
defaults:
  lockedByDefault: true

features:
  - id: graph-view
    kind: ui
    selectors: [".graph"]
    unlock: { exp: 2 }
  - id: explorer
    kind: ui
    selectors: [".explorer"]
    unlock: { exp: 1 }
  - id: properties
    kind: ui
    selectors: [".note-properties"]
    unlock: { exp: 5 }
  - id: wolke-toolbar
    kind: ui
    selectors: [".wolke-toolbar"]
    unlock: { exp: 0 }
  - id: exp-progress
    kind: ui
    selectors: ["[data-wolke-experience]"]
    unlock: { exp: 1 }
  - id: wings-routes
    kind: ui
    selectors: ["[data-wolke-wings-routes]"]
    unlock: { feature: open-wings }
  - id: volier
    kind: ui
    selectors: ["[data-wolke-volier]"]
    unlock: { feature: open-wings }
  - id: breadcrumbs
    kind: ui
    selectors: [".breadcrumb-container"]
    unlock: { exp: 15 }
  - id: table-of-contents
    kind: ui
    selectors: [".toc"]
    unlock: { exp: 5 }

  # Content paths can be pages or folders ending in /**.
  - id: samsa
    kind: content
    paths: ["characters/Samsa", "Samsa"]
    unlock: { exp: 10 }
  - id: open-wings
    kind: content
    paths: ["Open Wings"]
    unlock: { exp: 1 }
  - id: nimbus
    kind: content
    paths: ["NIMBUS"]
    unlock: { exp: 20 }
  - id: infinity
    kind: content
    paths: ["INFINITY"]
    unlock: { exp: 30 }
  - id: everything
    kind: content
    paths: ["EVERYTHING"]
    unlock: { exp: 1 }
  - id: kokos-vault
    kind: content
    paths: ["koko's vault/**"]
    unlock: { exp: 50 }

  # Add more callout specifiers here without changing the runtime.
  - id: callout-faq
    kind: ui
    selectors: ['.callout[data-callout="faq"]']
    unlock: { exp: 5 }
  - id: callout-info
    kind: ui
    selectors: ['.callout[data-callout="info"]']
    unlock: { exp: 5 }
  - id: callout-warning
    kind: ui
    selectors: ['.callout[data-callout="warning"]']
    unlock: { exp: 10 }
  - id: callout-tip
    kind: ui
    selectors: ['.callout[data-callout="tip"]']
    unlock: { exp: 1 }
  - id: callout-success
    kind: ui
    selectors: ['.callout[data-callout="success"]']
    unlock: { exp: 15 }
